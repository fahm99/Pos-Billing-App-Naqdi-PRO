name: billing_app
description: نقدي - تطبيق نقاط البيع والفواتير
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management & DI
  flutter_bloc: ^8.1.5
  get_it: ^7.6.7
  equatable: ^2.0.5
  
  # Functional Programming
  fpdart: ^1.1.0
  
  # Code Generation Annotations
  json_annotation: ^4.9.0
  
  # Navigation
  go_router: ^14.0.0
  
  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Utilities
  google_fonts: ^6.1.0
  intl: ^0.19.0
  
  # Scanner & Printer
  pretty_qr_code: ^3.3.0
  mobile_scanner: 6.0.11
  bloc: ^8.1.4
  uuid: ^4.5.2
  url_launcher: ^6.3.0

  # Image Picker
  image_picker: ^1.1.2

  # PDF & Sharing
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.0.0
  path_provider: ^2.1.4

  # HTTP
  http: ^1.2.2

  # Crypto
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  
  # Launcher Icons
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/naqdilogo.jpg"
  adaptive_icon_background: "#00A77E"
  adaptive_icon_foreground: "assets/naqdilogo.jpg"
